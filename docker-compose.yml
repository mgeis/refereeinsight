services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: referee_reports
      POSTGRES_USER: referee
      POSTGRES_PASSWORD: changeme
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # 5433 to avoid colliding with the local dev postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U referee -d referee_reports"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://referee:changeme@postgres:5432/referee_reports?schema=public
      AUTH_PROVIDER: local
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
